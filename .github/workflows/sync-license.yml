name: Dynamic License Sync

on:
  push:
    paths:
      - 'LICENSE.md'
      - 'LICENSE'
      - 'README.md'
    branches:
      - main

jobs:
  update-readme-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Garante o histórico correto para realizar o commit de volta
          fetch-depth: 0 

      - name: Inject License into README
        uses: tokusumi/markdown-embed-code@v1.0.0
        with:
          markdown: "README.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "docs: dynamically update license block in README"
