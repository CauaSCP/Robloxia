name: Dynamic License Sync

on:
  push:
    branches:
      - main # Garanta que seu branch padrão no GitHub se chama 'main' e não 'master'

jobs:
  update-readme-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject License into README
        uses: jasonatallah/markdown-include-action@v2

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: dynamically update license block in README"
